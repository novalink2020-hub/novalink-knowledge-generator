name: Generate Knowledge JSON V5

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run knowledge generator V5
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOVALINK_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITEMAP_URL: "https://novalink-ai.com/sitemap.xml"
          OUTPUT_PATH: "knowledge.v5.json"
        run: node generate-knowledge-v5.js

      - name: Commit Knowledge File (V5)
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add knowledge.v5.json
          git commit -m "Auto-update V5 knowledge JSON" || echo "No changes"
          git push
