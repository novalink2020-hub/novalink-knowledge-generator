name: Generate Knowledge JSON (V2.2 + V3)

on:
  schedule:
    - cron: "0 */12 * * *"  # كل 12 ساعة
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Generate V2.2 (Extract Only)
        run: node generate-knowledge-v2.js

      - name: Generate V3 (With Gemini Summaries)
        run: node generate-knowledge-v3.js

      - name: Commit Knowledge Files
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add knowledge.v2.json knowledge.v3.json
          git commit -m "Auto-update knowledge V2.2 & V3" || echo "No changes"
          git push
